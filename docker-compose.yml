#depreciated version: '3.8'

services:
  luckyweb-permissions:
    image: himilou/luckyweb:Prod2-1
    build: .
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        chown -R 1000:1000 /rails/public/event_img &&
        chmod -R u+rwX,g+rwX /rails/public/event_img &&
        chown -R 1000:1000 /rails/storage &&
        chmod -R u+rwX,g+rwX /rails/storage &&
        chown -R 1000:1000 /rails/public/menu &&
        chmod -R u+rwX,g+rwX /rails/public/menu
    volumes:
      - type: volume
        source: lucky_rails_public_assets
        target: /rails/public/event_img
        volume:
          nocopy: false
      - type: volume
        source: lucky_rails_storage
        target: /rails/storage
        volume:
          nocopy: false
      - type: volume
        source: lucky_rails_menu
        target: /rails/public/menu
        volume:
          nocopy: false

  luckyweb:
    depends_on:
      luckyweb-permissions:
        condition: service_completed_successfully
    image: himilou/luckyweb:Prod2-1
    build: .

    command: bundle exec rails server -b 0.0.0.0
    ports:
      - "80:80"
      - "443:443"
    
    volumes:
      # Mount codebase for live reload (development only)
      #- .:/rails
      
      # JSON data used by the Rails app.
      - lucky_rails_storage:/rails/storage
      # Named volume: Persists event images.
      - type: volume
        source: lucky_rails_public_assets
        target: /rails/public/event_img
      # Menu image file storage
      - type: volume
        source: lucky_rails_menu
        target: /rails/public/menu
      # Log files
      - lucky_rails_log:/rails/log
      
      # Anonymous volumes: Keep noisy logs and temporary files in Docker.
      #- /rails_app/tmp
      #- /rails_app/log
    environment:
      - RAILS_ENV=production
      - PORT=80
      - RAILS_LOG_TO_STDOUT=false
      # Docker will pull this value from your local terminal or .env file
      - RAILS_MASTER_KEY=${PRODUCTION_RAILS_MASTER_KEY}

  # Second container build for rake tasks to gather event flyers    
  luckytasks:
    depends_on:
      luckyweb-permissions:
        condition: service_completed_successfully
    image: himilou/luckytasks:Prod1
    # build: .
    # By default, this container will do nothing until you call it,
    # or you can give it a specific task to run on startup:
    build: .
    command: bundle exec rails images:run_all

    environment:
    - RAILS_ENV=production
      # Docker will pull this value from your local terminal or .env file
    - RAILS_MASTER_KEY=${PRODUCTION_RAILS_MASTER_KEY}
    - RAILS_LOG_TO_STDOUT=false

    volumes:
      - type: volume
        source: lucky_rails_public_assets
        target: /rails/public/event_img
      - lucky_rails_storage:/rails/storage
      - lucky_rails_log:/rails/log
      
volumes:
  lucky_rails_log:           # Persists development/production logs
  #  external: true
  # if creating volumes directory name will be appended to volume name. THIS DOES NOT HAPPEN WITH EXISTING
  lucky_rails_storage:
    name: lucky_rails_storage
  #  external: true
  lucky_rails_public_assets: #Persists files stored in /public/event_image
    name: lucky_rails_public_assets
  #  external: true
  lucky_rails_menu:
    name: lucky_rails_menu
   # external: true

  
